version: '3.9'

services:

  # ── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: .                   # project root — gives Dockerfile access to backend/
      dockerfile: Dockerfile.backend
    container_name: sg-booking-app-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      PORT: 3001
      # CORS origin: the browser loads the frontend from port 8080 in Docker
      FRONTEND_URL: http://localhost:8080
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: .                   # project root — gives Dockerfile access to frontend/ and nginx.conf
      dockerfile: Dockerfile.frontend
      args:
        # Browser-side API URL: backend is exposed on host port 3001
        VITE_API_BASE_URL: http://localhost:3001
    container_name: sg-booking-app-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: sg-booking-app-network
