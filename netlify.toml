# Netlify configuration for React + Vite frontend
# Import settings when connecting this repo in Netlify:
# - Branch: use the branch that contains the frontend you want to publish
# - Base directory: frontend
# - Build command: npm ci && npm run build
# - Publish directory: dist
# - Functions directory: leave blank (this repo does not use Netlify Functions)

[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Backend environment variables — set these in the Netlify dashboard
# VITE_API_BASE_URL = https://your-backend-url.com
# VITE_AUTH_PAYLOAD_KEY = change-this-auth-payload-key
